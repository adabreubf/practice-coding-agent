[project]
name = "backend-jwt-api"
version = "0.1.0"
description = "FastAPI JWT example"
authors = [
    {name = "GitHub Copilot",email = "copilot@example.com"}
]
requires-python = "^3.12"
dependencies = [
    "fastapi (==0.136.1)",
    "uvicorn (==0.46.0)",
    "pyjwt (==2.12.1)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (==9.0.3)",
    "httpx (==0.28.1)"
]

[tool.pytest.ini_options]
pythonpath = ["."]
[tool.poetry]
name = "jwt-auth-api"
version = "1.0.0"
description = "FastAPI JWT authentication demo"
authors = ["adabreubf"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.12"
uvicorn = {extras = ["standard"], version = "^0.34.2"}
pydantic = "^2.11.4"
PyJWT = "^2.12.0"
cryptography = "^46.0.5"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
httpx = "^0.28.1"
pytest-asyncio = "^0.26.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
