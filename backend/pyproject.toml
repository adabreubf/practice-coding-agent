[project]
name = "backend-jwt-api"
version = "0.1.0"
description = "FastAPI JWT example"
authors = [
    {name = "GitHub Copilot",email = "copilot@example.com"}
]
requires-python = "^3.12"
dependencies = [
    "fastapi (==0.136.1)",
    "uvicorn (==0.46.0)",
    "pyjwt (==2.12.1)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (==9.0.3)",
    "httpx (==0.28.1)"
]

[tool.pytest.ini_options]
pythonpath = ["."]
